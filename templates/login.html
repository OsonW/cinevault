<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineVault — Sign In</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:          #0e0e10;
  --surface:     #16161a;
  --card:        #1c1c21;
  --border:      rgba(255,255,255,0.07);
  --border-md:   rgba(255,255,255,0.12);
  --accent:      #a78bfa;
  --accent-hover:#8b6ef7;
  --accent-dim:  rgba(167,139,250,0.18);
  --text:        #f0ede8;
  --muted:       #7a7885;
  --red:         #e05252;
  --radius:      10px;
  --radius-lg:   14px;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.auth-wrap { width: 100%; max-width: 380px; padding: 24px; }
.auth-logo {
  font-family: 'Fraunces', serif;
  font-size: 1.6rem;
  font-weight: 300;
  text-align: center;
  margin-bottom: 28px;
  letter-spacing: 0.02em;
}
.auth-logo em { color: var(--accent); font-style: italic; }
.auth-card {
  background: var(--card);
  border: 1px solid var(--border-md);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
}
.auth-tabs {
  display: flex;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.auth-tab {
  flex: 1;
  padding: 9px 0;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.auth-tab.active { background: var(--accent-dim); color: var(--accent); }
.auth-tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }
.auth-field { margin-bottom: 14px; }
.auth-field label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.auth-field input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-md);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.2s;
}
.auth-field input:focus { border-color: var(--accent); }
.auth-field input::placeholder { color: var(--muted); }
.auth-error {
  background: rgba(224,82,82,0.1);
  border: 1px solid rgba(224,82,82,0.3);
  border-radius: var(--radius);
  padding: 9px 12px;
  font-size: 12px;
  color: var(--red);
  margin-bottom: 16px;
  display: none;
}
.auth-error.show { display: block; }
.auth-submit {
  width: 100%;
  padding: 10px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 4px;
}
.auth-submit:hover { background: var(--accent-hover); }
.auth-submit:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">Cine<em>Vault</em></div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="setMode('login')">Sign In</button>
      <button class="auth-tab" id="tabRegister" onclick="setMode('register')">Create Account</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-field">
      <label>Username</label>
      <input type="text" id="authUsername" placeholder="your username" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" minlength="4" maxlength="32" />
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" minlength="4" maxlength="32" />
    </div>
    <button class="auth-submit" id="authSubmit" onclick="submit()">Sign In</button>
  </div>
</div>
<script>
let mode = 'login';

function setMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabRegister').classList.toggle('active', m === 'register');
  document.getElementById('authSubmit').textContent = m === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('authPassword').autocomplete =
    m === 'login' ? 'current-password' : 'new-password';
  document.getElementById('authError').classList.remove('show');
}

async function submit() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('authSubmit');
  if (!username || !password) { showError('Please fill in all fields.'); return; }
  if (mode === 'register') {
    if (username.length < 4 || username.length > 32) {
      showError('Username must be 4–32 characters.'); return;
    }
    if (password.length < 4 || password.length > 32) {
      showError('Password must be 4–32 characters.'); return;
    }
    if (/\s/.test(username)) {
      showError('Username cannot contain spaces.'); return;
    }
    if (/\s/.test(password)) {
      showError('Password cannot contain spaces.'); return;
    }
  }
  btn.disabled = true;
  btn.textContent = 'Please wait…';
  try {
    const resp = await fetch(
      mode === 'login' ? '/auth/login' : '/auth/register',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      }
    );
    const data = await resp.json();
    if (resp.ok) {
      window.location.href = '/';
    } else {
      showError(data.error || 'Something went wrong.');
      btn.disabled = false;
      btn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
    }
  } catch {
    showError('Network error. Please try again.');
    btn.disabled = false;
    btn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  }
}

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
